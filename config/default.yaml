paths:
  metadata: /data/original_data/data_list.csv
  normalized_metadata: /data/processed/metadata.csv
  raw_documents: /data/original_data/files
  chunks: /data/processed/chunks_800_120.jsonl
  extraction_failures: /data/processed/extraction_failures.csv
  ocr_documents: /data/processed/ocr_documents.jsonl
  ocr_report: /data/processed/ocr_report.csv
  cleaned_documents: /data/processed/cleaned_documents.jsonl
  cleaning_report: /data/processed/cleaning_report.csv
  table_documents: /data/processed/table_documents.jsonl
  table_report: /data/processed/table_report.csv
  hwp_table_documents: /data/processed/hwp_table_documents.jsonl
  hwp_table_report: /data/processed/hwp_table_report.csv
  multimodal_documents: /data/processed/multimodal_documents.jsonl
  multimodal_report: /data/processed/multimodal_report.csv

cleaning:
  max_blank_lines: 1            # 연속으로 허용할 빈 줄 수
  min_duplicate_paragraph_length: 8   # 연속 중복 제거 대상이 되는 최소 내용 길이(정렬 공백 제외)
  requirement_id_pattern: "[A-Z]{2,4}-[0-9]{3,4}"  # 보존 검증에 쓰는 요구사항 번호 형식

chunking:
  chunk_size: 800
  chunk_overlap: 120

ocr:
  language: kor+eng
  python_path: ~/venvs/sprint-ai-ocr/bin/python
  general_psm: 6
  table_psm: 11
  cell_psm: 6
  table_line_density: 0.70
  table_dark_pixel_threshold: 80
  table_min_line_run_length: 2
  table_grid_min_lines: 2
  table_cell_grid_min_lines: 3
  table_cell_crop_margin: 1
  min_cell_width: 20
  min_cell_height: 20
  image_scale: 2
  min_width: 200
  min_height: 100
  min_text_length: 2

hwp_table:
  # 1행 또는 1열 표는 제목에 테두리를 넣은 서식이라 내용이 아닙니다.
  min_rows: 2
  min_columns: 2
  # 값을 적지 않은 빈 서식은 검색 근거가 되지 못합니다. 전체 표의 밀도 중앙값은 0.71입니다.
  min_density: 0.2

retrieval:
  active_profile: baseline
  top_k: 5 # fetch_k 적용으로 실제 검색 시 가져올 상위 결과 수 조정 (3 -> 5)
  search_method: mmr # similarity, mmr, hybrid(사용 불가)
  profiles:
    baseline:
      provider: lexical
    openai:
      provider: openai
      embedding_model: text-embedding-3-small # text-embedding-3-small(선택), text-embedding-3-large / 0714 정서호
      vector_db: chroma
      persist_directory: /data/processed/vector_db/openai # VM 경로로 저장 
      collection_name: bidmate_openai
      fetch_k: 100   # 부분 일치 검색 활용 / 100개 이상은 속도 저하, 노이즈 유입 가능성
      lambda_mult: 0.7 # MMR 변수 / 0.0에 가까울수록 다양성 중시, 1.0에 가까울수록 관련성 중시 / 0724 정서호
      batch_size: 1000 # vector DB에 데이터를 넣을 때 한 번에 처리할 데이터 수
    local:
      provider: huggingface
      embedding_model: null
      vector_db: chroma
      persist_directory: vector_db/local
      collection_name: bidmate_local

generation:
  provider: openai
  model: gpt-5-nano          # gpt-5-mini -> gpt-5-nano
  temperature: 0.1
  top_p: 0.95
  max_tokens: 4500           # 3000 -> 4500
  reasoning_effort: low      # 추가
  history:
    max_turns: 3

experiments:
  advanced_search:
    - mmr
    - hybrid
    - rerank

multimodal:
  # 라이브러리는 개인 가상환경, 모델은 /data/model_cache/huggingface 공용 캐시 사용
  model: Qwen/Qwen2.5-VL-3B-Instruct
  min_width: 200
  min_height: 100
  min_pdf_text_length: 20
  min_vlm_width: 500
  min_vlm_height: 200
  layout_row_gap_multiplier: 1.5
  model_cache_path: /data/model_cache/huggingface
  python_path: ~/venvs/sprint-ai-multimodal/bin/python  # paddleocr + transformers 모두 필요
  pdf_render_scale: 2
  paddle_language: korean
  paddle_ocr_version: PP-OCRv5
  paddle_device: cpu
  paddle_use_doc_orientation_classify: false
  paddle_use_doc_unwarping: false
  paddle_use_textline_orientation: false
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  device_map: auto
  max_new_tokens: 180
  # paddle_qwen: PaddleOCR + Qwen(현행) / paddle_openai: 판정·요약만 OpenAI / openai_only: 이미지 전체를 OpenAI
  extraction_mode: paddle_qwen
  openai_model: gpt-5-mini        # vlm_provider가 openai일 때 쓰는 비전 모델
  openai_max_output_tokens: 4000  # 상한값. 과금은 실제 사용량 기준(요약만 80, 전체 추출은 수백~수천)
  openai_reasoning_effort: minimal  # 유형 판정+한 문장 요약에 추론은 불필요. 기본값은 2배 느리고 토큰 4배
  openai_image_detail: high       # low로 낮추면 비용은 줄고 정확도는 떨어진다
  do_sample: false
